name: Maven Github Actions
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  test:
    name: Run test or java
    runs-on: ubuntu-latest
    steps:
      - name: get source code
        uses: actions/checkout@v6
      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin' 
          java-version: '17'
      - name: running tests
        run: mvn test

  build:
    needs: test #Sequential tests need to be delievered
    name: building maven
    runs-on: ubuntu-latest
    steps:
      - name: get source code
        uses: actions/checkout@v6
      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin' 
          java-version: '17'
      - name: build jar file
        run: mvn clean package
      - name: upload artificat #Uploads build on the summary actions page
        uses: actions/upload-artifact@v7
        with:
          name: artifact-data
          path: 'target/*.jar' #Picks any file in the target folder that has jar extension 

          
    

