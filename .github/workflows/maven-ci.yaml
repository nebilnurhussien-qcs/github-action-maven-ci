name: Maven Github Actions
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  test:
    name: Run test or java
    runs-on: ubuntu-latest
    steps:
      - name: get source code
        uses: actions/checkout@v6
      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin' 
          java-version: '17'
      - name: caching the dependency
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: running tests
        run: mvn test
  build:
    needs: test #Sequential tests need to be delievered
    name: building maven
    runs-on: ubuntu-latest
    outputs: #Allows the file name to be used on other jobs as well
      artifact-data: ${{ steps.artifact-name.outputs.artifact-data }} #Referencing the file to be used as output
    steps:
      - name: get source code
        uses: actions/checkout@v6
      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin' 
          java-version: '17'
      - name: build jar file
        run: mvn clean package
      - name: upload artificat #Uploads build on the summary actions page
        uses: actions/upload-artifact@v7
        with:
          name: artifact-data
          path: 'target/*.jar' #Picks any file in the target folder that has jar extension 
      - name: Get the name of output file
        id: artifact-name
        run: find target/*.jar -type f -execdir echo 'artifact-data={}' >> $GITHUB_OUTPUT ';'
        # Finds the .jar file's name and saves it as the step output "artifact-data"


  deploy:
      needs: build 
      name: taking artifacts of maven
      runs-on: ubuntu-latest
      steps:
        -  name: Get artifacts data from build jobs
           uses: actions/download-artifact@v7 #This action shows the uploaded artifact 
           with:
             name: artifact-data
        - name: list my artifact
          run: ls 
        - name: getting artifact file name
          run: echo ${{ needs.build.outputs.artifact-data }} #Over here we are getting file name from different job

          
